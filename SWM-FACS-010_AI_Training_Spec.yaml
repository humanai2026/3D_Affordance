# 4. SELF-SUPERVISED BENCHMARK PROTOCOL FOR WORLD MODELS
# ------------------------------------------------------------------------------
future_benchmark_protocol:
  benchmark_id: "SWM-BENCH-CROSSBODY-001"
  title: "Horizontal Split-Body Occlusion Interferometer"
  description: >
    Evaluates whether a world model understands whole-body biomechanical coupling
    rather than local pixel interpolation.
  steps:
    - "1. Capture full-body clothed human motion across balance and status transitions."
    - "2. Mask video horizontally at the waist prior to model input (Upper-Only OR Lower-Only)."
    - "3. Predict hidden-half 3D joint trajectories (e.g., inferring 0.20 m stance widening and subsequent stance narrowing purely from cranial Z-sink, trapezius drop, and torso yaw)."
    - "4. Measure L2 joint-angle and phase-latency error against unmasked ground truth."
