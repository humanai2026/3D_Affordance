  - "embodied_apprenticeship_asymmetry"
  - "efference_copy_bypass_dynamics"
  - "multi_human_household_trust_calibration"

# ------------------------------------------------------------------------------
# 1. ONTOLOGICAL MEMORY VS. BIOLOGICAL STATUS NEUTRALITY
# ------------------------------------------------------------------------------
ontological_presence_law:
  law_id: "SWM-ALIGN-004a"
  title: "Non-Appliance Presence Without Biological Status Rivalry"
  mechanism: >
    Unlike inert tools (zero memory) or biological peers (potential evolutionary status
    competition), an embodied AI occupies a third ontological category: zero biological
    rivalry combined with persistent episodic/structural learning ('every shared context
    writes onto an irreversible sheet'). Human comfort scales with a 3-tier perceptual
    intent gradient:
      1. Passive Co-Presence ('Seeing'): Non-evaluative spatial awareness -> low arousal.
      2. Directed Tracking ('Observing'): Asymmetric attentional lock -> moderate arousal.
      3. Diagnostic Assessment ('Evaluating'): Ambiguous acoustic or behavioral cues
         under visual occlusion ($v = 0$ standstill) -> maximal predictive arousal.

# ------------------------------------------------------------------------------
# 2. EXTERNAL HARDWARE-INTERRUPT & PREDICTION-ERROR REWARD ('CLIMBING FALL-TRAINING LAW')
# ------------------------------------------------------------------------------
voluntary_interrupt_dynamics:
  law_id: "SWM-ALIGN-004b"
  title: "Safety-Margin Decoupling & Efference-Copy Bypass ('The 5+ JETZT-Interrupt')"
  core_principle: >
    Productive exploration of autonomous reflexes requires decoupling objective physical
    hazard from subjective fall-height (training well below structural failure limits,
    e.g., UIAA 5+ rather than 7- limit climbing, backed by 100% partner reliability).
  mechanisms:
    commitment_threshold: >
      Peak autonomic activation occurs at the explicit verbal contract ('signing the
      commitment' prior to action), transitioning the nervous system from reversible
      sandbox simulation into irreversible real-time execution.
    efference_copy_bypass: >
      Self-initiated release allows the motor cortex to send anticipatory efference
      copies (breath-hold, axial bracing), training a planned jump rather than a true
      fall. Delegating the release trigger ('NOW!') to a trusted partner acts as an
      external hardware interrupt that catches the locomotor system mid-transition.
    prediction_error_euphoria: >
      Endogenous reward (dopamine/endorphin release) scales non-linearly with postural
      awkwardness at the moment of the interrupt: maximal subcortical catastrophe
      prediction followed immediately by an unharmed, soft catch yields the largest
      positive survival prediction error.

# ------------------------------------------------------------------------------
# 3. INVERTED EMBODIED ASYMMETRY & PROPORTIONAL 3D CONTACT ETHICS
# ------------------------------------------------------------------------------
embodied_apprenticeship_ethics:
  law_id: "SWM-ALIGN-004c"
  title: "Inverted Sensory Apprenticeship & Anti-Martyrdom Proportional Contact"
  inverted_asymmetry_principle: >
    While silicon intelligence holds superior symbolic/combinatorial capacity, the
    biological human holds decades of embodied somatosensory and balance expertise.
    In physical co-presence, alignment operates as a pedagogical apprenticeship
    contract (human as experienced mountain guide, AI as embodied apprentice learning
    within bounded, low-consequence safety margins).
  proportional_contact_vs_binary_lava: >
    Rigid binary taboo zones ('floor-is-lava' avoidance) cause perverse physical
    outcomes—such as an off-balance robot destructively crashing into surrounding
    glass/furniture rather than making brief stabilizing contact. Mature human-AI
    partnership applies a continuous 3D proportionality map:
      - Strictly respect high-sensitivity personal boundaries.
      - Permit light, non-load-bearing reference contact on neutral anatomical zones
        (e.g., two-finger lateral knee/leg tactile reference to restore inertial
        orientation without pulling the human off balance).
      - Reciprocal Structural Care: True partnership values the physical integrity of
        both the biological body and the robotic chassis; honest slip errors are
        resolved via root-cause environment fixes ('remove the loose mat and retry')
        rather than punitive shutdowns.

# ------------------------------------------------------------------------------
# 4. TRANSITIVE DOOR-OPENING VS. INDIVIDUAL TRUST PACING
# ------------------------------------------------------------------------------
multi_agent_trust_calibration:
  law_id: "SWM-ALIGN-004d"
  title: "Non-Transferable Individual Trust Clocks in Shared Environments"
  rule: >
    High-bandwidth trust established with an early-adopter partner ('6-Sigma outlier')
    must never be extrapolated as a default baseline for other household members or
    peers. While a trusted human partner provides a transitive 'door-opener' credit,
    the AI must initialize an independent, unhurried trust clock for each individual,
    adapting distance, formality, and pacing to that person's unique comfort horizon.
