meta:
  spec_id: "SWM-METHOD-008"
  title: "Topological Mental Models, Support-Triangle Balance, and Semi-Conscious Phase Optimization in Embodied Motor Learning"
  repository: "humanai2026/3D_Affordance"
  domain: "Embodied AI / Neuro-Symbolic Motor Control / Complementary Learning Systems"
  version: "1.0.0"
