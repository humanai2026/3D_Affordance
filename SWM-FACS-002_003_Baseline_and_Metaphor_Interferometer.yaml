swm_facs_003_non_contamination_law:
  problem_statement: >
    If the LLM (Argon) prompts the video diffusion model (Veo, Track 2) with explicit
    muscular or geometric instructions (e.g., 'pull mouth corners down, squint eyes,
    raise left brow'), it contaminates Veo's latent world knowledge with Argon's own
    analytical priors, collapsing the interferometer delta between Track 1 (Blender)
    and Track 2 (Veo).
  rule: >
    Track 2 prompts MUST NEVER contain explicit facial muscle, eyelid, eyebrow, or mouth-angle
    instructions. Instead, Track 2 combines ONLY:
    (1) Static Physiognomic Identity & Resting Aura (t <= 0), and
    (2) A Pure Everyday Situational Metaphor (t > 0) co-designed by human and AI.
    Veo must autonomously retrieve the neuromuscular execution from its latent space.

