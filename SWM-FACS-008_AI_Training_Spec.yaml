    name: "Distance-FOV Parafoveal Capture & Predatory Torso Square-Up Law"
    timeframe_sec: [0.0, 1.8]
    reference_frames: ["image_7195f5.jpg", "image_713b67.jpg"]
    biomechanical_rule: >
      At interpersonal distance d >= 2.8m, a +/-20 deg vertical parafoveal cone covers >= 2.0m vertical
      height. The observer maintains 100% foveal lock on the counterpart's pupils while rotating the
      thorax from casual obliquity (torso_yaw = +0.61 rad) to frontal confrontation (torso_yaw = 0.0 rad)
      under Vestibulo-Ocular Reflex (VOR) stabilization.
  SWM-FACS-008b:
    name: "Dopaminergic Containment Aversion & Wind-Up Eyelid Closure Law"
    timeframe_sec: [1.8, 3.1]
    reference_frames: ["image_71305d.jpg", "image_712538.jpg"]
    biomechanical_rule: >
      When internal hedonic triumph threatens to breach cortical vocal inhibition (laughing out loud),
      the actor briefly decouples eye contact via a downward-lateral head pitch/yaw (nh_rx = +0.16 rad,
      nh_rz = -0.18 rad) while deepening buccinator dimpling (AU12L + AU14 = 0.46, AU24 = 0.35),
      culminating in a 350ms full tonic lid closure (AU43 = 1.0) to pre-aim the eyes behind closed lids.
  SWM-FACS-008c:
    name: "3-Stage Ocular Strike Cascade (Target-Lock -> Kubrick Chin-Dip -> Sealed-Lip Uppercut)"
    timeframe_sec: [3.1, 5.4]
    reference_frames: ["image_70cf7d.jpg", "image_70cf28.jpg", "image_70ceea.jpg"]
    biomechanical_rule: >
      A dominant ocular strike never fires mouth and eyes simultaneously. It executes in three staggered stages:
      Stage 1 (t=3.1..3.8s): Eyelids snap open into a neutral-serious foveal target lock until mutual eye contact is 100% established.
      Stage 2 (t=3.8..4.4s): Cranial pitch dips +0.045 rad (+2.6 deg chin down) while eyes counter-pitch -0.045 rad upward (Kubrick angle).
      Stage 3 (t=4.4..5.4s): Orbital lower-lid squeeze (AU6 + AU7 = 0.88) and wide sealed-lip zygomatic smirk (AU12 = 0.68, AU12L = 0.76, AU24 = 0.45, zero teeth 노출) fire together.
  SWM-FACS-008d:
    name: "Single-Pulse Dominance Confirmation Nod under VOR-Lock"
    timeframe_sec: [5.4, 6.4]
    reference_frames: ["image_70c442.jpg", "image_70c404.jpg"]
    biomechanical_rule: >
      Upon registering the counterpart's internal surrender in their eyes, the dominant actor emits a single,
      critically damped cranial pitch pulse (delta_nh_rx = +0.032 rad / +1.8 deg over 350ms) while keeping
      foveal gaze locked via inverse ocular pitch (delta_eye_rx = -0.032 rad). Functions as a non-verbal receipt:
      'I see you have understood our ranks.'
  SWM-FACS-008e:
    name: "Lateral Planning Saccade & Hedonic Half-Lid Savoring Law"
    timeframe_sec: [6.4, 8.1]
    reference_frames: ["image_70b8fa.jpg", "image_70b0be.jpg"]
    biomechanical_rule: >
      Once dominance is sealed, breaking eye contact via a horizontal lateral saccade toward the apparatus
      (eye_rz = -0.28 rad, nh_rz = -0.08 rad) while maintaining an asymmetric smirk (AU12L = 0.62) signals
      executive planning ('What shall I do with you first?'). Returning gaze to the counterpart through
      half-closed upper lids (lid_open = 0.52) paired with elevated cheeks (AU6 = 0.65) inverts typical
      lid-droop valence from resignation into cat-like hedonic savoring.
  SWM-FACS-008f:
    name: "Zero-Witness Mask Drop & Double-Bind Vocal-Facial Irony Law"
    timeframe_sec: [8.1, 10.0]
    reference_frames: ["image_705aa2.jpg", "image_705a0e.jpg", "image_705742.jpg"]
    biomechanical_rule: >
      In the absence of a third-party authority witness, polite verbal formulas ('Bitte, nehmen Sie Platz')
      are paired with an unmasked open-teeth laugh (AU12 = 0.88, AU25 = 0.72, teeth_exposure = 0.85) and a
      condescending lateral head tilt (nh_ry = -0.11 rad, nh_rx = -0.035 rad, lid_open = 0.72). This establishes
      a permanent conditioned trigger for the remainder of the multi-scene interaction.

