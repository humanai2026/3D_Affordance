# 1. BLIND BASELINE (SOLL_0: Typical Ungrounded LLM Failure Modes)
# =============================================================================
blind_baseline_soll_0:
  description: >
    Initial uncalibrated 3D motor synthesis generated before iterative visual
    and biomechanical falsification. Represents standard LLM blind spots in
    embodied spatial reasoning.
  documented_failure_modes:
    - id: "FAIL-01_Static_Scene_Coordinate_Prison"
      symptom: "Inheriting fixed foot coordinates from an earlier narrative layout after shifting a cantilevered fixture outward."
      physical_consequence: "Pelvis sits 25.9 cm from fixture; kneeling traps knees underneath the curved cradle ('Limbo crouch') and forces elbows behind the ribcage."
    - id: "FAIL-02_Pitch_Sign_Inversion_and_Laser_Cheating"
      symptom: "Applying negative X-pitch (-rx) to spine/head in a -Y anterior frame and orienting the sightline cylinder directly in world coordinates."
      physical_consequence: "Torso leans backward away from the task while a visually plausible gaze ray bends 75 deg out of the visor and pierces straight through solid cradle geometry."
    - id: "FAIL-03_Collinear_Forearm_and_Forward_Euler_Thumb"
      symptom: "Approaching a cylindrical lever nearly collinearly with the forearm and guessing forward Euler angles at the thumb saddle joint."
      physical_consequence: "Severe 70 deg lateral wrist kink, palm intersecting the cradle floor, and an abducted 'hitchhiker thumb' pointing into empty air instead of opposing the fingers."
    - id: "FAIL-04_Single_Block_Flat_Foot_Hyper_Dorsiflexion"
      symptom: "Modeling the foot/shoe as a single rigid block pinned flat to Z=0.0 during a deep split-squat lunge."
      physical_consequence: "Rear ankle reaches 84.2 deg dorsiflexion (exceeding the ~28 deg human anatomical limit by >55 deg, equivalent to acute Achilles/capsular injury)."

# =============================================================================
# 2. FALSIFICATION & MEASUREMENT METHODOLOGY
# =============================================================================
falsification_and_measurement_methodology:
  anti_calculator_reward_principle:
    rule: >
      Never patch local coordinates in execution code to satisfy isolated visual
      metrics. Every geometric correction must originate in the semantic intent
      model (Kopfbild) and execute through a strictly parent-child kinematic tree
      where proximal joints cannot silently absorb distal constraint violations.
  four_space_volumetric_separation:
    purpose: >
      Separates external contact, active neural muscle drive, and internal passive+active
      tendon/capsule tension into toggleable, X-ray-combinable 3D collections:
    spaces:
      - space_id: "01_Space_Volume"
        radius_scale: 1.00
        role: "Neutral exterior body, garment, and 2-segment articulated footwear geometry."
      - space_id: "02_Space_Muscles"
        radius_scale: 0.82
        role: "Mid-bone contractile muscle bellies (Slate -> Amber -> Crimson = pure active neural drive)."
      - space_id: "03_Space_Extero_Tactile"
        radius_scale: 1.05
        role: "Outer skin/sole contact shells (volar finger/thumb pads + split Heel vs. Forefoot_Ball pads; Cyan/Amber thermal -> Ivory/Magenta normal load)."
      - space_id: "04_Space_Internal_Strain"
        radius_scale: 0.92
        role: "Peri-articular tendon and joint-capsule cuffs evaluating additive Hill tension (Sage-Green comfort -> Amber transfer -> Vivid Purple 'Anschlag Lila' overload >= 0.95)."
  coaxial_oculomotor_gate:
    mechanism: >
      Sightline ray is parented rigidly along the -Y_local optical axis of a
      clamped 2-DOF eye joint (|eye_pitch| <= 25 deg, |eye_yaw| <= 25 deg).
      Gaze target alignment is achievable only via genuine pelvis, spine, neck,
      and eye kinematics without shell intersection.

