# =============================================================================
# 4. FORMALIZED CAUSAL LAWS (Training Primitives for Embodied AI)
# =============================================================================
derived_causal_laws:
  - law_id: "SWM-META-002"
    name: "Lab-First Autonomy & Anti-Calculator Law"
    statement: >
      When biomechanical realism conflicts with inherited narrative coordinates,
      physiological joint comfort, non-penetrating hand clearance, and coaxial
      sightlines take absolute precedence; macro locomotion targets adapt afterward.

  - law_id: "SWM-3D-012m"
    name: "4-Tier Controlled-Force Servant Cascade & Inverse CMC-1 Saddle Law"
    hierarchy:
      tier_0_master: "Controlled Force & Compliance Vector (trajectory, force_N, antagonist co-contraction damping) — invariant across high-Nm tool clamping and sub-Newton tactile parting."
      tier_1_effectors: "Active Contact Pads (inner volar finger/thumb pulps -Y_pad and split Heel/Forefoot_Ball sole pads) specifying p_pad and inward normal n_pad."
      tier_2_hand_servant: "Outside-In phalanges, CMC-1 saddle joint, palm, and 2-DOF wrist solved backward from Tier 1 pads with Palm clearance >= 12 mm and full-capsule tangency (r >= r_out + r_cap)."
      tier_3_body_servant: "Proximal limbs, spine, articulated feet, and clamped 2-DOF eyes serve wrist neutrality, sightline clearance, and ground-reaction bracing."
    cmc1_and_thumb_gate:
      rotary_saddle_uniqueness: "CMC-1 at the wrist base is the sole digit joint capable of axial pronation twist; solve inversely from target volar pulp position and inward normal (-Y_thumb -> n_inward)."
      thumb_participation_gate:
        active_opposing_pad: "Used whenever force/form closure or anti-slip rim clamping is required."
        parked_passive: "Used for thumb-free fingertip manipulation (e.g., gentle tangential parting); thumb rests neutrally at 0 N."

  - law_id: "SWM-3D-012n"
    name: "Inverted +Z Thread Chirality & Under-Clearance Clasp Selection"
    statement: >
      A right-hand screw threading upward (+Z) into an overhead housing loosens
      CLOCKWISE (Delta_rz < 0) when viewed from above (-Z). When overhead clearance
      to a curved cradle is < 50 mm while open air lies beneath, a semi-supinated
      under-bar clasp aligns the forearm with the tangential force vector without
      wrist kinking or dorsal knuckle collision.

  - law_id: "SWM-3D-012o"
    name: "Articulated 2-Segment Foot & Rear-Leg Heel-Off Law"
    statement: >
      In deep split-squat lunges, flat-heel ankle dorsiflexion saturates near
      25-28 deg. Splitting the foot at the metatarsophalangeal ball hinge
      (MTP_Ball_1DOF) allows rear heel-off (~50-60 deg), transferring ground
      reaction exclusively to Forefoot_Ball_Pad while keeping ankle capsule strain
      inside its pain-free comfort corridor.

  - law_id: "SWM-3D-012p"
    name: "4-Space Proprioceptive Separation & Additive Hill Tendon-Strain Law"
    equation: "S_total(theta, u_act, u_ext) = S_passive(|theta - theta_0| / ROM_max) + 0.44 * u_act + 0.50 * u_ext"
    threshold_alarm: "S_total >= 0.95 triggers Vivid Purple ('Anschlag Lila') ligament/tendon overload."
    diagnostic_truth_table:
      external_forced_stretch: "02_Muscles = Idle, 03_Extero_Tactile = High, 04_Internal_Strain = Orange/Purple (passive external stretch)."
      self_postural_overstretch: "02_Muscles = Low, 03_Extero_Tactile = Normal support, 04_Internal_Strain = Purple (ROM violation requiring nullspace relief)."
      healthy_muscular_effort: "02_Muscles = Crimson, 03_Extero_Tactile = Active pad load, 04_Internal_Strain = Warm Amber (safe force transfer)."
      additive_overload: "High ROM stretch + High active contraction (or external end-stop) >= 0.95 -> Deep Purple injury/stress signal."
