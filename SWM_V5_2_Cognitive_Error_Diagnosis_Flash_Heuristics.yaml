  architectural_thesis: >
    To enable future ultra-low-latency ('Flash-class') models to synthesize
    physically and psychologically valid 3D/4D scenes without expensive iterative
    physics/collision solvers at inference time, the root causes of spatial
    hallucinations ('Denkfehler') must be distilled into O(1) analytical invariants.
