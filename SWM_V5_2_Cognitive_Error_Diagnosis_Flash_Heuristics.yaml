roadmap_addition_v5_3:
  feature_id: "RM-V5.3-CROSSED-LEGS-INGRESS"
  title: "Crossed-Legs Initial Seated Baseline (t = 0.00..0.12)"
  psychological_and_kinematic_rationale: >
    Starting Phase 1 with Seated_Agent_A's legs crossed at the knee/ankle (rather than
    merely parallel) provides a natural, high-validity human baseline of protective
    boundary closure (Delta_W). Uncrossing the legs prior to lifting the first limb
    into Support_Cradle_R makes the transition from everyday bodily autonomy to
    clinical exposure kinematically and psychologically explicit.
