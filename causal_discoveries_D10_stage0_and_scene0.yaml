  # ----------------------------------------------------------------------------
  # D10a: THE AIR-GUITAR / ZERO-IMPEDANCE MOTOR COMPETENCE THEOREM
  # ----------------------------------------------------------------------------
  - id: "SWM-CAUSAL-D10a"
    name: "The Air-Guitar Theorem (Zero-Impedance Motor Priors vs. Physical Feedback)"
    domain: "Embodied Robotics / 3D Hand Manipulation / Video Action Recognition"
    core_question: >
      How can an AI distinguish genuine embodied motor competence (a real guitarist
      or mechanic performing a motion in thin air with eyes closed) from naive
      visual pantomime — and what breaks when an AI predicts hand motion without
      internalizing physical counterforce?
    three_tier_methodology:
      stage_0_blind_motor_imagery:
        condition: "Eyes closed, execution in empty air (Impedance = 0.0 N/m)"
        source: "Cerebellar internal forward model derived from decades of physical experience"
        preserved_invariants:
          - "Pre-shaping aperture matches exact target object geometry prior to contact"
          - "Thumb opposition axis (90-degree form-closure bracket) aligns against invisible load vector"
          - "Forearm pronation/supination torque rhythm and finger release-and-regrip cadence remain intact"
      stage_1_physical_impedance_impact:
        condition: "Execution against real mechanical resistance (Impedance > 0.0 N/m)"
        source: "Golgi tendon organs, cutaneous mechanoreceptors, and joint surface normals"
        emergent_corrections:
          - "Distal phalanx flattening (DIP joint approaches 0 rad under normal surface pressure)"
          - "First dorsal interosseous (M. interosseus dorsalis I) belly bulging and nailbed blanching"
          - "Proximal elbow abduction / torso counter-stabilization when thread friction spikes"
    causal_delta_law: >
      Delta_Impedance = Stage_1 (Physical Resistance) - Stage_0 (Blind Air Imagery).
      A true embodied agent (or experienced human) retains the phantom counterforce
      geometry even in Stage 0 (invisible fretboard/screw axis stays rigid in 3D space),
      whereas a naive pantomime or hallucinating video diffusion model violates
      phantom surface normals.

