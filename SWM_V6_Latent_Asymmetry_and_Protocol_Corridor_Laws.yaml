# ------------------------------------------------------------------------------
# LAW 1: DOUBLE-INVERTED EXPECTANCY GRADIENT (RELIEF-TO-LOCK AMPLIFICATION)
# ------------------------------------------------------------------------------
law_1_expectancy_gradient:
  name: "Relief-Dip to Commitment-Lock Shock Amplification"
  target_scene: "Scene_0_Preload_and_Entry"
  causal_mechanism: >
    Autonomic and kinematic startle amplitudes in human actors are governed not by
    the absolute magnitude of an environmental stressor E(t), but by the temporal
    gradient dE/dt relative to the immediate prior expectancy baseline E_hat(t - dt).
  phases:
    phase_a_initial_alert:
      t_window: "t < -120s (Pre-Scene Waiting Zone)"
      state: "Actor_A detects a socially pre-loaded counterpart (Actor_B), raising baseline vigilance."
    phase_b_false_relief_dip:
      t_window: "t = -90s..-10s"
      state: >
        Contextual cues suggest Actor_B is assigned to an unrelated background task.
        Actor_A experiences a parasympathetic relief drop (E_hat -> 0) and crosses
        an irreversible procedural commitment threshold (entering the prep state).
    phase_c_substitution_shock:
      t_window: "Scene_0 (Frame 0..60)"
      state: >
        Due to an unannounced operational substitution, Actor_A encounters Actor_B
        as the primary workstation operator after crossing the commitment threshold.
  kinematic_manifestation:
    gait_interruption: "10..12 frame bipedal velocity freeze during weight transfer (Locomotion Stutter)."
    protective_micro_reflex: "Bilateral wrist vector dip toward lower garment hem (+0.04m..+0.06m Z-shielding impulse) prior to pride-driven posture recovery."

# ------------------------------------------------------------------------------
# LAW 2: SUB-THRESHOLD MODULATION WITHIN PROTOCOL CORRIDORS (PLAUSIBLE DENIABILITY)
# ------------------------------------------------------------------------------
law_2_protocol_corridor_modulation:
  name: "Latent Status Equilibration within Institutional Tolerance Bounds"
  cognitive_principle: >
    When two actors share an unresolved prior status asymmetry (Prior_Dissonance > 0)
    and enter an institutional setting where Actor_B holds procedural authority over
    an immobilized Actor_A (mu_locomotion = 0), latent interpersonal tension rarely
    manifests as overt rule violation. Instead, it modulates physical and visual
    parameters strictly within the "Corridor of Plausible Deniability"
    [P_min_protocol, P_max_protocol].
  mathematical_model:
    parameter_equation: "P_applied(u) = P_nominal + u * (P_max_tolerable - P_nominal)"
    control_variable_u:
      empathetic_rapport: "u in [-0.5, 0.0] -> Force/proximity minimized toward comfort boundary P_min."
      neutral_routine: "u = 0.0 -> Standard nominal execution P_nominal."
      unresolved_status_friction: "u in [+0.6, +0.95] -> Parameter pushed to the upper edge of protocol tolerance P_max_tolerable without crossing the overt violation threshold."
  observational_implication_for_ai: >
    Embodied AI systems evaluating human-human or human-robot assistance must read
    micro-shifts in holding tension, dwell duration, and gaze alignment within valid
    procedural bounds as primary indicators of latent relational subtext.

