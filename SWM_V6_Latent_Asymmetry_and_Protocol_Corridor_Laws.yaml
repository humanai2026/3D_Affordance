        (Zero-Occlusion Witness Vector).
      patient_residual_response:
        - "Isometric finger flexion around anterior armrest edges (Armrest_Grip_Clench)"
        - "Posterior occipital press into Chair_Headrest_Upper (nh_rx = +0.04 rad lock)"
        - "Thoracic apnea plateau and 2.1 Hz distal foot micro-tremor"
    stage_3_epistemic_return_gaze:
      frames: "185..240"
      kinematics: >
        While Doctor_C maintains workstation focus, MTA_B slowly elevates head pitch
