        (nh_rx +0.24 rad, Stage 2 Downward Gaze-Sweep).
    stage_2_over_shoulder_witness_alignment:
      frames: "90..185"
      kinematics: >
        Doctor_C advances rolling stool (Y = -0.78 -> -0.72 m), inclines thorax
