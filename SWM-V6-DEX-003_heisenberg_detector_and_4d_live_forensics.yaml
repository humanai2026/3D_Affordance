# ==============================================================================
# 1. THE BIOMECHANICAL HEISENBERG DETECTOR (CORTICAL VS. CEREBELLAR SEPARATION)
# ==============================================================================
heisenberg_detector_architecture:
  paradox_definition: >
    When a human consciously attempts to demonstrate or verbally describe how they
    walk or manipulate an object, top-down cortical attention overrides the subconscious
    cerebellar autopilot, producing stiff, artificial movement (Heisenberg Observation
    Distortion). Furthermore, human consciousness only perceives macro-intent (V3)
    and sensory alarms (fatigue, sweat/slip), remaining blind to micro-kinematic execution.
  experimental_solution:
    physical_load_constraint: >
      Apply high real-world mechanical resistance (40 lb / 180 N climbing ring) so the
      cerebral cortex has zero bandwidth to fake kinematics and the cerebellum is forced
      to execute authentic survival and efficiency micro-adaptations.
    stream_A_conscious_cortical: "Pre-experiment chat expectation + live spoken audio commentary during task."
    stream_B_subconscious_cerebellar: "Uncompressed 1 Hz sequential camera frame buffer captured via Gemini Live and analyzed post-hoc under High Thinking Effort."
    heisenberg_delta_formula: "Delta_Heisenberg(t) = State_Cerebellar_Frames(t) - State_Cortical_Audio_Model(t)"
  operational_compute_split:
    high_thinking_effort: "Mandatory for multi-frame temporal forensics (40+ frames), MoCap rehearsal direction with Cristine, and 3D/4D mathematical synthesis."
    low_thinking_effort: "Mandatory when executing large file writes (write_skill_file / update_skill) to prevent platform tool timeouts."

# ==============================================================================
# 2. SIX 4D MICRO-LAWS EXTRACTED FROM THE 40-FRAME LIVE EXPERIMENT (00:13 - 01:55)
# ==============================================================================
four_dimensional_micro_laws:

  - law_id: "LAW-4D-D1"
    name: "Three-Zone Nail-Bed Blood Damming, 250-ms Refill Lag & Reactive Hyperemia"
    frame_evidence: "Frames 01:29 (baseline) -> 01:32..01:35 (40-lb peak) -> 01:36 (unloading) -> 01:38 (post-release)"
    biomechanical_mechanism:
      spatial_pattern: >
        40-lb volar fingertip pressure creates a central snow-white ischemic compression
        band across the nail plate while damming blood into dark red-violet halos at the
        distal free edge and proximal nail fold (Lunula).
      temporal_refill_lag: >
        Upon finger extension at 01:36, capillary refilling lags mechanical ring expansion
        by 200-300 ms (white band persists momentarily on opening hand).
      reactive_hyperemia: >
        At 01:37-01:38, unloaded fingertips flush significantly brighter crimson-red than
        the 01:29 pre-load baseline due to post-ischemic vasodilation.
    video_forensic_utility: "Allows retro-detection of prior high-force exertion up to 2 seconds after the hand has already opened."

  - law_id: "LAW-4D-D2"
    name: "Subconscious Cerebellar Thumb Strategy Switch (Enclosure vs. Shear-Wall Periscope)"
    frame_evidence: "Frame 01:33 (Cycle 1) vs. Frames 01:39 & 01:44 (Cycles 2 & 3)"
    conscious_cortical_experience: "Subject feels increasing effort and slight palmar moisture/slip risk."
    subconscious_cerebellar_execution: >
      In Cycle 1 (01:33, slow squeeze), the thumb IP joint flexes inward around the upper
      ring rim, nearly colliding with the radial side of the index finger. In Cycles 2 and 3
      (01:39, 01:44, rapid pumping), the cerebellum autonomously switches strategy without
      conscious awareness: the thumb distal phalanx stays abducted/extended upward-left like
      a periscope while the Thenar eminence (Z5) and proximal phalanx act as a pure lateral
      shear wall, clearing the flexion corridor for the index finger.

  - law_id: "LAW-4D-D3"
    name: "Neuromuscular Dual-Task Rotational Force Dip (Pronation-Supination Under Load)"
    frame_evidence: "Frames 00:41 (supinated crush) -> 00:45..00:48 (active rotation) -> 00:51..00:54 (pronated re-crush)"
    subconscious_cerebellar_execution: >
      When rotating the forearm from supination to pronation while attempting to maintain
      a continuous 40-lb crush, finger flexion force involuntarily dips by 20-30% during
      mid-rotation (00:46-00:47, ring widens slightly) as neural drive is shared with
      Pronator teres/quadratus (Z6), followed by a distinct secondary re-crush impulse
      (00:51-00:54) once pronation is complete.

  - law_id: "LAW-4D-D4"
    name: "Radial-Edge Verification of the +22 deg Power-Grip Wrist Lock & Tabatiere Pop"
    frame_evidence: "Frame 00:43 (90 deg neutral radial-edge view)"
    subconscious_cerebellar_execution: >
      Side-profile confirmation of Law M1: under 40-lb volar grip flexion, the dorsal hand
      plane locks at +22 deg dorsiflexion relative to the forearm axis while Extensor
      pollicis longus pops into sharp relief at the anatomical snuffbox (Tabatiere).

  - law_id: "LAW-4D-D5"
    name: "Time-Dependent Venous Pressure Shunting (Optical Isometric Duration Clock)"
    frame_evidence: "Frame 01:31 (t = 0.3s hold) vs. Frame 01:35 (t = 4.0s hold)"
    biomechanical_mechanism: >
      At force onset (01:31), the white Palmaris longus tendon cable pops out immediately
      (<0.3s) while adjacent superficial veins are flat. Across seconds 2 to 4 of continuous
      40-lb isometric hold (01:32-01:35), high deep-compartment intramuscular pressure
      occludes deep venous return, shunting blood into the superficial subcutaneous network
      so the blue volar wrist Y-vein progressively engorges.
    video_forensic_utility: "Decodes elapsed isometric hold duration (0.2s vs. 4.0s) from a single video frame."

  - law_id: "LAW-4D-D6"
    name: "Intent-Driven Inter-Repetition Tonus Hysteresis (Hook Memory)"
    frame_evidence: "Frame 01:29 (pre-set rest) vs. Frames 01:38 & 01:43 (inter-rep open pause)"
    subconscious_cerebellar_execution: >
      Between repetitions of a multi-rep set (01:38, 01:43), opening the hand does NOT
      reset muscle tone to Grey (0.00): fingers remain curved in a pre-shaped isometric
      hook and wrist flexor tendons retain ~25% residual relief (Yellow) because Vector 3
      (Intent) keeps the motor program primed for the upcoming repetition.
    video_forensic_utility: "Predicts with >90% confidence whether an actor has finished a task or will initiate another repetition within <1.5s."