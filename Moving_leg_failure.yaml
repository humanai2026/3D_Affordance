benchmark_metadata:
  id: "SWM-V4.1-4D-TRAJECTORY-001"
  milestone: "Transition from Static 3D Affordance (t=1.0) to 4D Keyframe Animation (Frames 1..120)"
  evaluated_model: "Gemini (Argon)"
