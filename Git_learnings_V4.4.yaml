# 3B. HOLISTIC 7-JOINT BIOMECHANICAL TAXONOMY (PRIORITY 1 FOR V4.4 & OPTION A)
# ------------------------------------------------------------------------------
biomechanical_7_joint_grammar:
  scope_focus: >
    Omit fingers and toes. Focus learning on the 7 expressive & load-bearing core
    joints: Foot/Ankle (Fuß), Knee (Knie), Hip (Hüfte), Shoulder (Schulter),
    Elbow (Ellbogen), Wrist/Hand (Hand), and Neck (Nacken).
  class_1_ball_and_socket (Hip, Shoulder):
    dof: "3-DoF (rx flexion, ry abduction, rz axial rotation)"
    tendon_rule: "Deep capsular tether (Hip) vs. mobile muscular/scapular tether (Shoulder; allows protective shoulder-shrugging)."
  class_2_hinge_and_pivot (Knee, Elbow):
    dof: "1-DoF flexion/extension (Knee) / 2-DoF flexion + forearm pronation/supination (Elbow)"
    tendon_rule: >
      Hard stop at 0.0 rad extension (no hyperextension). Virtual tendon tether between
      sphere center and cylinder cap maintains constant orbital radius (via Arc-Subdivision
      <= 15 deg per keyframe interval) plus ~1.5mm elastic inertial lag against gravity.
  class_3_condyloid_biaxial (Wrist/Hand, Ankle/Foot):
    dof: "2-DoF bounded tilt (rx pitch + tightly limited ry lateral deviation; axial spin rz locked)"
    tendon_rule: "Short, high-stiffness retinaculum/ligament tether preventing translational gap."
  class_4_elastic_bending_chain (Neck / Cervical Spine):
    dof: "Coupled 3-DoF rotation + translational bending arc"
    tendon_rule: "Multi-vertebra continuum: head rotation is always accompanied by a proportional tilt of the neck cylinder itself."
rule_3_explicit_tendon_primitives_as_xray_gauges ("Sichtbare Sehnen-Seelen"): >
    Add explicit, thin cylinder primitives (e.g., 'Scene.Human_Calf_L.Knee_Tendon_L',
    diameter = 0.020m, length = 0.060m, local_offset = [0.0, 0.0, 0.030]) inside each
    core joint in 'enhanced_pass_2a'. Normally concealed inside the joint sphere (r=0.055m)
    and limb cylinder (r=0.050m), these tendon cores act as visual QA gauges:
    (1) They remain invisible during healthy motion unless X-Ray (Alt+Z) or sphere hiding is toggled.
    (2) Any chord-shortcut or rotational decoupling immediately exposes the tendon or creates
        a measurable gap against the recessed cylinder cap (z_cap = 0.060m), allowing Gemini
        to measure sub-millimeter tendon stretch and alignment errors directly from screenshots!    