v4_4_implementation_plan:
  rule_1_the_arc_subdivision_law (Preventing Chord Shortcuts): >
    Whenever a limb rotates by more than 15 degrees (0.26 rad) in a single phase,
    insert intermediate kinematic keyframes (e.g., at t = 0.15, t = 0.18, t = 0.20
    for Left lift, and t = 0.49, t = 0.52, t = 0.54 for Right lift). At max 15 deg per
    interval, the chord-to-arc error 0.19 * (1 - cos(0.13)) drops below 1.6mm (0.8%),
    completely eliminating the Frame 22 knee impaling without touching Python!
  rule_2_biomechanical_tendon_tether_and_inertial_lag: >
    Model the virtual tendon between Knee Sphere center and Calf Cylinder top end:
    (a) Set baseline calf axial offset so the flat cylinder rim sits safely inside the
        knee capsule (local_offset = [0.0, 0.0, 0.195] with length 0.37m -> 5mm tendon gap).
    (b) During initial upward thigh acceleration against gravity (t = 0.00 -> 0.12 Left,
        t = 0.46 -> 0.52 Right), include inertial calf lag (knee flexes slightly from
        1.52 to 1.55 rad and tendon stretches by +1.5mm along Z) before swinging up.

