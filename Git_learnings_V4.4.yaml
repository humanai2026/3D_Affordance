# ------------------------------------------------------------------------------
# 2. THE COGNITIVE FLAW ("DENKFEHLER") BEHIND THE KNEE IMPALING (FRAMES 1 TO 30)
# ------------------------------------------------------------------------------
root_cause_cognitive_analysis:
  the_human_observation: >
    Thomas observed that while the knee looks round at Frame 1 and again after Frame 30,
    the calf cylinder pushes slightly upward into the knee during initial lift (Frames 2-14,
    where real physics would dictate the exact opposite: gravity + inertia slightly stretching
    the knee tendons downward by ~1-2mm), normalizes around Frame 18, and then violently
    bursts out through the top of the knee sphere at Frame 22 before recovering at Frame 30.

  cognitive_flaw_1_snapshot_vs_chord_interpolation ("Das Sekanten-Paradoxon"):
    what_the_ai_thought: >
      The AI suffered from "Keyframe Snapshot Blindness": it verified that the distance
      between the Knee Sphere center and the Calf Cylinder center was exactly 0.19m at
      t = 0.12 (Frame 15) and t = 0.22 (Frame 27), assuming the limb would stay intact
      in between.
    why_it_failed_mathematically: >
      Because 'create_mesh.py' parents animated objects directly to 'world_ground' and
      Blender linearly interpolates world 'location' and 'rotation_euler' between keyframes,
      both the Knee Sphere and the Calf Cylinder center travel along straight Euclidean
      CHORDS (Sekanten) rather than circular arcs! Between t = 0.12 (Frame 15) and t = 0.22
      (Frame 27), the thigh swings upward by 42.4 deg (rx: 1.42 -> 0.68 rad) and the calf
      rotates by 67.6 deg (global rx: 2.92 -> 1.73 rad). At the midpoint of this huge angular
      jump (Frame 21-22, t = 0.17), the straight chord shortcuts the circular arc by
      1 - cos(1.18 rad / 2) = 16.9%, pulling the calf center 3.2cm to 4.2cm inside the
      knee sphere and causing the upper calf rim to pierce out the top of the knee!

  cognitive_flaw_2_missing_tendon_and_inertia_biomechanics ("Sehnen-Invarianz & Trägheit"):
    what_the_ai_thought: >
      The AI treated the volumetric limb segments as abstract geometric primitives that
      immediately start extending (knee rx: 1.52 -> 1.50 rad) the instant the hip lifts
      at t = 0.00 -> 0.12.
    why_it_failed_physically: >
      In human biomechanics, bones are held together by tendons and ligaments (Patellar
      tendon, cruciate/collateral ligaments) acting as a high-stiffness elastic tether
      between the joint pivot and the bone cap. When the hip flexors accelerate the thigh
      upward against gravity (Frames 1-14), the heavy lower leg experiences inertial lag:
      gravity pulls the calf slightly downward, stretching the knee tendon by ~1.5mm
      (a micro-increase in axial offset and slight passive knee flexion rx: 1.52 -> 1.55 rad)
      rather than compressing the tibia into the femur!

  cognitive_flaw_3_zero_margin_cylinder_cap ("Flacher Zylinderdeckel im Kugelzentrum"):
    what_the_ai_thought: >
      Placing a flat cylinder cap of radius r_calf = 0.050m exactly at the center (z = 0.0)
      of a knee sphere of radius r_knee = 0.055m leaves enough radial cover.
    why_it_failed_geometrically: >
      A flat cylinder of radius 5.0cm inside a 5.5cm sphere leaves only 5mm of radial shell
      thickness at the cylinder's circular rim (sqrt(0^2 + 0.05^2) = 0.050m vs 0.055m).
      Even a tiny 6mm chord-interpolation error pushes the sharp 90-degree cylinder edge
      outside the spherical silhouette. Recessing the anatomical bone cap slightly along
      the tendon axis (or increasing joint sphere encapsulation margin) prevents rim poke-through.

