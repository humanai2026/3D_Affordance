core_insight: >
  A facial micro-expression delta (t > 0) cannot be evaluated in isolation from the
  character's resting physiognomic tonus (t <= 0). The psychological impact of a posture
  or facial shift is proportional to the contrast (Fall Height / Camouflage Contrast)
  between the resting social mask and the triggered state.

