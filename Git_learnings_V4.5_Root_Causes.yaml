# 3. UNIVERSAL ARCHITECTURAL LAWS FOR V4.5.1 (NEXT SESSION)
# ------------------------------------------------------------------------------
v4_5_1_implementation_laws:
  law_1_cantilever_l_bracket_verification ("Kein Bauteil darf im Raum schweben"): >
    Whenever a child component's origin lies outside the 3D bounding box of its
    parent link (such as armrests at |X| = 0.27m vs. Seat_Frame at |X| = 0.25m),
    verify 3D bounding-box intersection along X, Y, AND Z. Extend the vertical post
    down to Z = -0.02m and add an explicit horizontal L-bracket cylinder/bar bridging
    X = -/+0.20m to -/+0.27m at Z = -0.02m into 'Seat_Frame'.
  law_2_anterior_torso_envelope_and_recline_compensation ("Bauchwand-Tangenten-Gesetz"): >
    (a) To fold hands over the abdomen without forearm-to-torso penetration, the
        elbows must rest at the anterior ribcage margin (Y_elbow <= Y_torso_front),
        requiring upper arms to stay ~0.25 rad (14 deg) flexed forward of the torso's
        longitudinal axis at all times: rx_shoulder(t) = pi + |rx_torso(t)| + 0.25 rad.
    (b) As the torso reclines from rx = -0.35 to -1.05 rad (t = 0.80..1.00), shoulder
        rx must increase 1:1 with the torso recline (from 3.49 rad to 4.19 rad) so
        the elbows ride ON TOP OF the reclining abdominal wall instead of sinking
        through it!