# ------------------------------------------------------------------------------
# 2. THE TWO ELEMENTAL COGNITIVE FLAWS ("BASIS-DENKFEHLER") DISCOVERED BY THOMAS
# ------------------------------------------------------------------------------
root_cause_cognitive_analysis:
  cognitive_flaw_1_floating_side_attachments ("Der L-Bügel-Trugschluss" / Missing L-Bracket):
    the_human_observation: >
      Thomas immediately spotted that both Chair Armrests ('Chair_Armrest_R/L') float
      in mid-air beside the seat pan with no physical connection to the chair frame.
    what_the_ai_thought: >
      The AI placed the armrest origin at X = -/+0.27m, Z = +0.24m (to clear the
      0.48m-wide cushion) and extended a vertical post 0.20m downward (to Z = +0.04m),
      falsely assuming it would touch the seat pan.
    why_it_failed_physically_and_geometrically: >
      Two simultaneous blind spots occurred:
      (1) Vertical Gap: 'Seat_Frame' spans Z = -0.04m to 0.00m, so a post ending at
          Z = +0.04m stops 4cm above the frame in empty air!
      (2) Lateral Gap: 'Seat_Frame' has width 0.50m (spanning X = -0.25m to +0.25m).
          A vertical post at X = -/+0.27m stands 2cm outside the frame's outer edge!
          Any lateral attachment mounted outside a parent volume's bounding box MUST
          include a horizontal structural cantilever ('Armrest_Horizontal_Bracket_R/L')
          bridging from inside the frame (|X| = 0.22m, Z = -0.02m) outward to the
          vertical post base (|X| = 0.27m, Z = -0.02m).

  cognitive_flaw_2_torso_arm_penetration_during_recline ("Bauchwand-Durchdringung"):
    the_human_observation: >
      While the folded hands and forearms clear the thighs nicely and sit in front
      of the abdomen in the upright initial pose (Frame 1-40), the forearms sink
      progressively deeper into the abdomen as the backrest reclines, ending up
      almost completely buried inside 'Torso_Core' at Frame 120 (with only the
      hand tips peeking out of the stomach).
    why_it_failed_mathematically_and_geometrically: >
      Two coupled errors caused the forearms to submerge into the torso:
      (1) The Convex Chord-Across-Box Paradox (Geometric): 'Torso_Core' is a 0.34m
          wide box whose front abdominal wall sits at local Y_front = -0.19m across
          its entire width (X = -0.17m to +0.17m). For two forearms to angle inward
          from the elbows (at X = -/+0.18m) to meet at the midline (X = 0.0) WITHOUT
          cutting through the flat abdominal wall, the elbows themselves MUST sit in
          front of or level with the anterior abdominal plane (local Y_elbow <= -0.18m),
          meaning the upper arms must flex slightly forward (+15 to +20 deg relative
          to the torso plane) rather than hanging straight down alongside the back of
          the ribcage!
      (2) Additive Euler Recline Drift in 'swm_compiler.py' (Mathematical): Because
          'swm_compiler.py' adds parent and child Euler angles component-wise
          (group_rot = torso_rot + shoulder_rot + elbow_rot), reclining the torso
          from rx = -0.35 rad to -1.05 rad (-60 deg) while only increasing shoulder
          rx from 3.22 to 3.55 rad caused the net global upper-arm angle
          (rx_global = -1.05 + 3.55 = 2.50 rad = 143 deg) to lag 27 degrees BEHIND
          the reclining torso plane (which tilted by 40 deg)! Worse, in XYZ Euler
          order, applying medial forearm yaw (rz = +/-0.53 rad around the WORLD
          vertical Z-axis) onto a 60-degree reclined torso rotates the forearms
          downward INTO the reclined stomach rather than across its surface!

