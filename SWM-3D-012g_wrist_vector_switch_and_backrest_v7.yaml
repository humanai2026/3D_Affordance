title: "The Badminton-Climbing Wrist Vector-Switch Theorem & The Comfort-Driven Ulnar Shift Law (Backrest Release v6 -> v7)"

executive_summary: >
  Establishes the fundamental triadic division of labor between the macroscopic body chain,
  the 3-DoF wrist complex (carpal flexion/extension, radial/ulnar deviation, and radioulnar
  pronation/supination), and the 5-ray digital friction interface (thumb + 4 fingers).
  Resolves the v6 thumb-penetration defect (-35.0 mm mesh penetration caused by forcing the
  index and middle fingers onto the backrest release button at palm_yaw_chair = -3.0 deg)
  by applying an ergonomic wrist bend (palm_yaw_chair = -16.0 deg, palm_roll_chair = +10.5 deg).
  This shifts the thumb tangentially onto the upper-rear backrest rounding (+0.69 mm to +4.71 mm
  clearance across all 240 frames) and transfers button actuation from the index/middle fingers
  to the middle, ring, and pinky fingers.

universal_biomechanical_laws:
  Law_1_Badminton_Principle_Wrist_Vector_Switch:
    german_name: "Das Badminton-Prinzip: Das Handgelenk als terminale Vektor-Weiche"
    kinematic_hierarchy:
      proximal_body_chain: >
        Feet -> Legs -> Pelvis -> Torso -> Shoulder -> Elbow act as the macroscopic
        kinetic energy and torque generator (Newton-meter pump), delivering momentum
        along a global approach trajectory.
      wrist_forearm_complex: >
        The carpal wrist (Pitch rx, Yaw/Deviation rz) plus radioulnar twist (Roll/Pronation-Supination ry)
        acts as a 3-DoF cardan vector-switch in the final 2 cm and final milliseconds before impact/contact.
        It decouples the proximal body trajectory from the terminal tool/force vector (e.g., converting
        a full-swing baseline clear into a short drop-shot solely via wrist angle and impedance modulation,
        without altering macroscopic body motion).
    ai_world_model_implication: >
      Macroscopic IK (shoulder + elbow + wrist position) only encodes kinetic energy transport.
      The true causal intent and force direction are encoded in the 3 rotational degrees of freedom
      of the wrist (wrist_rpy).

  Law_2_Climbing_Principle_Friction_And_CoM_Equilibrium_Bridge:
    german_name: "Das Kletter-Prinzip: Maximale 5-Finger-Reibung & Handgelenks-Zugvektor über dem Fuß-Schwerpunkt"
    kinematic_hierarchy:
      distal_fingers_and_thumb: >
        Fingers and thumb form the friction and form-closure interface (F_friction = mu * F_normal + Form_Closure).
        Maximal stability requires coordinated contact area and pressure distribution across all participating rays.
      wrist_as_pull_vector_director: >
        When the body moves relative to a fixed world hold (standing up on a foothold while pulling on a handhold),
        a rigid wrist would either pry the fingers off the hold's optimal surface normal or pull the body's
        Center of Mass (CoM) away from the vertical plumb line over the standing foot (barn-door torque).
        The wrist continuously articulates during locomotion so that (1) the fingers maintain their optimal
        load angle on the hold surface AND (2) the resultant tensile force vector keeps the whole-body CoM
        in equilibrium directly above the stabilizing foot.
    ai_world_model_implication: >
      In closed-chain human-object interactions, the wrist is a dynamic equilibrium hinge that bridges
      fixed object surface normals at the fingertips with moving whole-body CoM constraints.

  Law_3_Comfort_Driven_Ulnar_Shift_Button_vs_9Plus_Climbing:
    german_name: "Das Ergonomie-vor-Maximalkraft-Gesetz: Knopf drücken statt 9+ Klettern (Ulnarer Finger-Shift)"
    causal_rule: >
      When task impedance is low-to-moderate (e.g., pressing a 5-15 N release button rather than holding
      full body weight on a 9+ climbing hold), the human CNS prioritizes comfortable, collision-free wrist
      and thumb posture (Rosenbaum End-State Comfort) over recruiting the strongest radial digits (Index + Middle).
    trade_off_mechanics: >
      By abducting/deviating the wrist slightly (-16.0 deg Yaw) and supinating the radial border (+10.5 deg Roll),
      the thumb rests effortlessly and tangentially on the rear cushion contour without hyper-abduction or mesh penetration.
      The human motor system gladly accepts the geometric trade-off that the Index finger shifts outward past the button
      while the Middle, Ring, and Pinky fingers take over button depression.

