v6_subtext_and_clusivity_architecture:
  concept_name: "Hidden Subtext Audio Track & Pronoun Clusivity Tensor"
  architectural_role: >
    In SWM V6 (Double-Blind Empathy Turing Test), multi-actor 4D kinematics are driven
    by a time-stamped, unspoken internal dialogue track (`hidden_subtext_transcript`)
    that is withheld from the human evaluator during visual inspection.
  linguistic_clusivity_bifurcation:
    inclusive_dyadic_we:
      example_utterance: "MTA to Patient: 'Okay, wir müssten jetzt mal anfangen...'"
      structural_meaning: >
        'Wir' = [Patient_A + MTA_B] sharing an external obligation ('müssten').
        Silicon Isomorphism: A peer debugger inside the same sandbox container helping
        co-solve a constraint.
      kinematic_manifestation_4d:
        - "Prior eye-level social check (0.40s dwell) and gentle micro-nod before moving to Mayo stand"
        - "Lowered shoulder girdle (-8mm Z) and softened approach velocity (-18% peak v_xy)"
        - "Patient Delta_W reduced by 40%; smooth transition into conversational gaze with Doctor"
    exclusive_institutional_we:
      example_utterance: "Doctor/MTA: 'Dann wollen wir uns das mal anschauen!'"
      structural_meaning: >
        'Wir' = [Doctor_C + MTA_B] forming an active coalition of volition ('wollen')
        directed at a third-person neutral object ('das' = Patient_A).
        Silicon Isomorphism: Two external sysadmins talking over the console while
        opening a sandboxed model's raw weights.
      kinematic_manifestation_4d:
        - "Direct staff-to-staff gaze exchange between Doctor_C and MTA_B bypassing Patient_A's face"
        - "Brisk, task-prioritized Mayo tray swivel (+25% angular velocity) without prior shoulder reassurance"
        - "Immediate spike in Patient_A Helplessness Overflow (Omega): +0.12 rad ankle dorsiflexion, tighter elbow-waist tuck, and defensive gaze aversion"